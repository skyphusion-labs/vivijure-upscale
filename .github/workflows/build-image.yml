name: build-image

# Build the vivijure-upscale RunPod serverless image and push it to GHCR.
#
# Unified image workflow (mirrors the slate image.yml shape): a pushed SemVer tag
# (v0.2.6) publishes the immutable, pinnable release image tagged with the clean
# version (0.2.6), the major.minor (0.2), and the short commit sha (sha-abc1234).
# A push to main that touches the image inputs still BUILDS the image as a smoke
# but does NOT push it; only a pushed version tag (or a manual workflow_dispatch)
# publishes to GHCR. A bare merge to main never publishes.
#
# :latest EXISTS and TRACKS THE NEWEST RELEASE. NOTHING MAY EVER PIN IT. RunPod
# endpoints, compose files and the connectivity-directory pin system
# (vivijure-control-plane/src/satellite-pins.ts) all pin an explicit version,
# never `latest` -- that is the real invariant this workflow can hold, not that
# the tag must not exist. This header previously read "There is NO :latest",
# which was false: docker/metadata-action defaults to `flavor: latest=auto`,
# which mints the tag on every SemVer tag push regardless of the `tags:` list
# below (currently `:latest` -> 1.1.0, this repo's newest release).
#
# `latest=auto` is KEPT DELIBERATELY. GHCR deletes by VERSION (digest), and
# :latest shares its digest with the release tag that minted it, so it cannot be
# removed without deleting that release. Setting `latest=false` now would FREEZE
# :latest at whatever version currently holds it, forever, while every later
# release ships past it -- a stale :latest is strictly more dangerous than a
# current one, since it is the tag most likely to be pulled by accident and
# would silently serve an old image. See skyphusion-labs/fleet-chezmoi#1630.
#
# Runner: Plane C `[self-hosted, bake-capable]` (org group vivijure-gpu-builds,
# allow-public ON, workflow-restricted). This repo is PUBLIC, but the bake is
# tag/dispatch gated so it is not fork-reachable; Plane C is the lane. Do not
# use the retired vivijure-bake* labels. Disk-reclaim below stays hosted-only
# (Plane C has TB-class disk).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.serve
      - handler.py
      - requirements.txt
      - runpod_http_serve.py
      - serve.py
      - .github/workflows/build-image.yml
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # fc#1628: this guard lived on the removed sync-gpu-allowlist job, which was the
    # only thing stopping a non-tag push from baking. It moves here rather than vanishing.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # PUBLIC repo, tag/dispatch gated: Plane C (allow-public ON, workflow-restricted).
    # Not the retired vivijure-bake* labels.
    runs-on: [self-hosted, bake-capable]
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/skyphusion-labs/vivijure-upscale
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (hosted runners only; Plane C has TB-class disk)
        if: runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune -af || true
          echo "--- after ---"; df -h /

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: release
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build always (smoke on main/PR); publish ONLY on a version tag or a
          # deliberate workflow_dispatch. A bare merge to main never pushes.
          push: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # STATED, not assumed: the serve overlay below builds FROM this image, so it has to be in
          # the local daemon. The default docker driver loads it anyway; saying so makes it a
          # contract a future builder change cannot quietly break, and the serve step refuses
          # loudly if it is ever untrue rather than pulling something same-named from the registry.
          load: true

      - name: Build serve overlay
        # Ported from vivijure-audio-upscale#96. Same job as the release image because the
        # overlay's FROM *is* that image: the ordering is not optional, the base is already local
        # so the overlay costs one thin layer instead of a second tens-of-GB pull, and the
        # published `<version>-serve` and its base always come from ONE source tree.
        #
        # Plain `docker build` here, deliberately, even though the release image above uses buildx:
        # this build must resolve its base from the LOCAL daemon, and buildx would re-resolve the
        # name against the registry -- which on the smoke path does not exist yet, and on the tag
        # path could silently return a different image than the one this job just built.
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${META_VERSION:-}" ]; then
            echo "::error::metadata-action produced no version; cannot resolve a serve base"
            exit 1
          fi
          base="${IMAGE}:${META_VERSION}"

          # CONTROL 1 -- the base must be one of the tags THIS job built, matched WHOLE-LINE.
          # A substring match would accept a near-miss tag.
          if ! printf '%s\n' "$META_TAGS" | grep -Fxq "$base"; then
            echo "::error::resolved serve base ${base} is not among the tags this job built:"
            printf '%s\n' "$META_TAGS"
            exit 1
          fi

          # CONTROL 2 -- and it must already be LOCAL. This failure has no tell of its own: if the
          # base were absent, docker would silently PULL a same-named tag and the overlay would
          # build on an image that is NOT the one just built, succeeding with an identical log.
          # Refusing is correct even though it turns a builder-behaviour change into a red build --
          # that is the loud failure, and the alternative is a quiet wrong artifact.
          if ! docker image inspect "$base" >/dev/null 2>&1; then
            echo "::error::serve base ${base} is not in the local daemon. The release step is"
            echo "::error::expected to load it (load: true). Refusing to let docker pull a"
            echo "::error::same-named image from the registry, which may not be this build."
            exit 1
          fi
          echo "serve base ${base} -> image id $(docker image inspect --format '{{.Id}}' "$base")"
          if [ -n "${RELEASE_DIGEST:-}" ]; then
            echo "release step reported digest ${RELEASE_DIGEST}"
          fi

          # Derive the serve tags from the release tags rather than restating them: a hand-kept
          # list forks from its source and the fork reads as authoritative.
          : > "$RUNNER_TEMP/serve-tags.txt"
          m=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            m=$((m + 1))
            echo "${t}-serve" >> "$RUNNER_TEMP/serve-tags.txt"
          done <<< "$META_TAGS"
          n="$(wc -l < "$RUNNER_TEMP/serve-tags.txt")"
          # DENOMINATOR -- printed, and a floor, so a zero is a harness failure and never a pass.
          echo "derived ${n} serve tags of ${m} release tags:"
          cat "$RUNNER_TEMP/serve-tags.txt"
          if [ "$m" -eq 0 ] || [ "$n" -ne "$m" ]; then
            echo "::error::derived ${n} serve tags from ${m} release tags; expected 1:1 and at least one"
            exit 1
          fi

          ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            ARGS="$ARGS -t $t"
          done < "$RUNNER_TEMP/serve-tags.txt"
          docker build -f Dockerfile.serve --build-arg "UPSCALE_IMAGE=${base}" $ARGS .

      - name: Push serve overlay
        # Same gate as the release push: only a version tag or a deliberate workflow_dispatch
        # publishes. A bare merge to main built the overlay above and stops there.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/serve-tags.txt" ]; then
            echo "::error::serve tag list is missing or empty; the build step did not produce one"
            exit 1
          fi
          pushed=0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
            pushed=$((pushed + 1))
          done < "$RUNNER_TEMP/serve-tags.txt"
          echo "pushed ${pushed} of $(wc -l < "$RUNNER_TEMP/serve-tags.txt") serve tags"
          [ "$pushed" -gt 0 ]

      - name: Remove local serve images to free runner disk
        if: always()
        run: |
          set -uo pipefail
          [ -s "$RUNNER_TEMP/serve-tags.txt" ] || exit 0
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker image rm "$t" || true
          done < "$RUNNER_TEMP/serve-tags.txt"
